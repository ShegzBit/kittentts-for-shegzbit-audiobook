[project]
name = "kittentts-test"
version = "0.1.0"
description = "Minimal Flask TTS API backed by KittenTTS"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    # gunicorn has no Windows support (no fork); dev flow uses `python app.py`.
    "gunicorn>=22; sys_platform != 'win32'",
    "psutil>=6",
    "soundfile==0.14.0",
    "numpy==2.2.6",
    "onnxruntime==1.23.2",
    "huggingface_hub==2.2.0",
    "misaki==0.9.4",
    "phonemizer==3.4.0",
    "espeakng-loader==0.2.4",
    # Pinned to the proven CPU build; resolved via the PyTorch CPU index below.
    "torch==2.14.1+cpu",
    # KittenTTS is only published as a GitHub release artifact, not PyPI.
    "kittentts @ https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl#sha256=482a436c4f1f3192153710376e459ff3689517ebcda7c2b051e2fd4187b41851",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
